name: QuanToot Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.forgejo/workflows/website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.forgejo/workflows/website.yml'
  workflow_dispatch:

concurrency:
  group: quantoot-website-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: android-ci
    timeout-minutes: 12
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify static pages and links
        run: npm run check --prefix website
      - name: Install pinned Wrangler
        if: forgejo.ref == 'refs/heads/main' && (forgejo.event_name == 'push' || forgejo.event_name == 'workflow_dispatch')
        run: npm ci --prefix website --no-audit --no-fund
      - name: Deploy to Cloudflare Pages
        if: forgejo.ref == 'refs/heads/main' && (forgejo.event_name == 'push' || forgejo.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "Configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_PAGES_TOKEN in repository secrets."
            exit 1
          }
          npm run deploy --prefix website
