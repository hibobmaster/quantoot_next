name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '.audit/**'
      - '.forgejo/workflows/website.yml'
      - '.github/workflows/**'
      - 'docs/**'
      - 'iosApp/**'
      - 'shared/src/iosMain/**'
      - 'website/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.audit/**'
      - '.forgejo/workflows/website.yml'
      - '.github/workflows/**'
      - 'docs/**'
      - 'iosApp/**'
      - 'shared/src/iosMain/**'
      - 'website/**'

env:
  JAVA_TOOL_OPTIONS: '-Djdk.serialFilter=!com.google.common.collect.CompactHashMap*;!com.google.common.collect.CompactHashSet*;!com.google.common.collect.MapMakerInternalMap*'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.workers.max=2 -Dorg.gradle.daemon=false -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process'

jobs:
  verify:
    if: forgejo.ref_type != 'tag'
    runs-on: android-ci
    timeout-minutes: 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore Gradle dependencies
        id: gradle_cache
        uses: https://data.forgejo.org/actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/caches/modules-2/metadata-*
          key: quantoot-gradle-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'settings.gradle.kts') }}
      - run: ./scripts/verify.sh
      - name: Save Gradle dependencies from main
        if: success() && forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' && steps.gradle_cache.outputs.cache-hit != 'true' && steps.gradle_cache.outputs.cache-primary-key != ''
        uses: https://data.forgejo.org/actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/caches/modules-2/metadata-*
          key: ${{ steps.gradle_cache.outputs.cache-primary-key }}
      - uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # Forgejo v4
        if: always()
        with:
          name: shared-test-results
          path: shared/build/reports/tests/
          retention-days: 14

  release:
    if: forgejo.event_name == 'push' && startsWith(forgejo.ref, 'refs/tags/v')
    runs-on: android-ci
    timeout-minutes: 30
    enable-openid-connect: true
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that this tag points into main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Restore Gradle dependencies
        uses: https://data.forgejo.org/actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/caches/modules-2/metadata-*
          key: quantoot-gradle-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'settings.gradle.kts') }}
      - name: Build release APKs
        run: ./gradlew --no-daemon -PsplitApks=true :shared:testAndroidHostTest :androidApp:assembleRelease --console=plain
      - name: Sign and verify the four APKs
        run: bash ci/android/request-signing.sh
      - name: Publish signed APKs to Forgejo Releases
        run: node ci/android/publish-release.mjs
